name: Telegram Reminders - Ture 2026

on:
  schedule:
    # Todos los horarios en UTC (Argentina = UTC-3)
    - cron: '0 16 * * 1,3,5'  # 13:00 ART - Empujon de entreno (lun/mie/vie)
    - cron: '0 0 * * *'       # 21:00 ART - Cargar la planilla del dia
    - cron: '0 23 * * 0'      # 20:00 ART - Cierre de semana (domingo)
  workflow_dispatch:
    inputs:
      test:
        description: 'Enviar mensaje de prueba'
        required: false
        default: 'test'

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Determinar y enviar recordatorio
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Hora actual en Argentina (Cordoba)
          HOUR=$(TZ='America/Argentina/Cordoba' date +%H)
          WEEKDAY=$(TZ='America/Argentina/Cordoba' date +%u)  # 1=lun ... 7=dom

          echo "Hora Argentina: ${HOUR}h (dia ${WEEKDAY})"

          send_msg() {
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              --data-binary "{\"chat_id\":\"${TG_CHAT}\",\"text\":\"$1\"}" \
              | jq -r '.ok'
          }

          # Test manual primero, asi se puede probar a cualquier hora
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            send_msg "Test: bot de la planilla funcionando. ✅"

          # 13:xx ART - Empujon de entreno (lun/mie/vie)
          elif [ "$HOUR" = "13" ]; then
            send_msg "Mitad del dia: gimnasio o correr son 10 pts, futbol 8, movilidad 3. Algo es mejor que nada. 💪"

          # 20:xx ART domingo - Cierre de semana
          elif [ "$HOUR" = "20" ] && [ "$WEEKDAY" = "7" ]; then
            send_msg "Cierre de semana: entra a la planilla y fijate si llegaste a la meta semanal. 📊"

          # 21:xx ART - Cargar el dia
          elif [ "$HOUR" = "21" ]; then
            send_msg "Carga el dia en la planilla. Los puntos que no anotas no existen. ⚡"
          fi
