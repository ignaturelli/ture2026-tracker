<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0a09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ture 2026">
  <title>Ture 2026 · Planilla</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <meta property="og:title" content="Ture 2026 · Planilla de entrenamiento">
  <meta property="og:description" content="Un día con entreno cuenta como una sesión. Los puntos se suman todos.">
  <meta property="og:image" content="https://ture2026-tracker.vercel.app/og-image.png">
  <meta property="og:url" content="https://ture2026-tracker.vercel.app">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://ture2026-tracker.vercel.app/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0c0a09;--card:#1c1917;--c2:#292524;--line:#292524;--line2:#44403c;
      --t:#f5f5f4;--t2:#a8a29e;--t3:#78716c;--t4:#57534e;
      --acc:#facc15;--red:#dc2626;--r:16px;
      --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
    }
    body{background:var(--bg);color:var(--t);font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    .wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
    .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
    button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
    .card{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px}
    .h2{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
    .lbl{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.16em;color:var(--t3)}

    /* HEADER */
    .hdr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
    .hdr-lv{margin-top:4px;font-size:1.5rem;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;color:var(--acc);line-height:1.1}
    .hdr-pts{font-family:var(--mono);font-size:2.8rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
    .bar{margin-top:16px;height:8px;width:100%;background:var(--c2);border-radius:999px;overflow:hidden}
    .bar-fill{height:100%;background:var(--acc);border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1)}
    .hdr-foot{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:.68rem;color:var(--t3)}
    .sync{display:flex;align-items:center;gap:6px;flex-shrink:0}
    .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--t4);transition:background .3s}

    /* SEMANA */
    .row-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .week{margin-top:16px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:12px;transition:background .15s}
    .wd:active{background:var(--c2)}
    .wd.sel{background:var(--c2)}
    .wd-l{font-family:var(--mono);font-size:.66rem;color:var(--t3)}
    .wd.today .wd-l{color:var(--acc)}
    .wd-n{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;border:2px dashed var(--line2);color:var(--t4);transition:all .2s}
    .wd.on .wd-n{border:none;color:#0c0a09}
    .wd-dots{display:flex;gap:2px;height:5px}
    .wd-dots i{width:5px;height:5px;border-radius:50%;display:block}
    .stats{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
    .st{background:var(--c2);border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .st-n{font-family:var(--mono);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
    .st-l{margin-top:5px;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);line-height:1.15;min-height:2.3em;display:flex;align-items:center;padding:0 2px}

    /* CARGAR DÍA */
    .acts{margin-top:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    @media(min-width:520px){.acts{grid-template-columns:repeat(3,1fr)}}
    .act{text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);transition:all .15s}
    .act:active{transform:scale(.97)}
    .act.on{background:var(--c2);border-color:var(--line2)}
    .act-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .act-dot{width:24px;height:24px;border-radius:50%;border:2px dashed var(--line2);display:flex;align-items:center;justify-content:center;transition:all .2s}
    .act.on .act-dot{border:none}
    .act-dot svg{display:none}
    .act.on .act-dot svg{display:block}
    .act-pts{font-family:var(--mono);font-size:.7rem;color:var(--t4)}
    .act.on .act-pts{color:var(--acc)}
    .act-name{display:block;margin-top:8px;font-size:.85rem;font-weight:600;line-height:1.2;color:var(--t2)}
    .act.on .act-name{color:var(--t)}
    .act-sub{display:block;margin-top:3px;font-size:.66rem;color:var(--t4)}
    .link{font-family:var(--mono);font-size:.7rem;color:var(--t2);text-decoration:underline}

    /* MES */
    .cal-nav{display:flex;align-items:center;justify-content:space-between}
    .cal-btn{padding:5px 12px;border-radius:10px;background:var(--c2);font-family:var(--mono);font-size:.85rem;line-height:1.2}
    .cal-btn:active{background:var(--line2)}
    .cal{margin-top:16px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
    .cal-h{font-family:var(--mono);font-size:.64rem;color:var(--t4);padding-bottom:4px}
    .cal-d{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.72rem;background:var(--bg);color:var(--t4);transition:all .15s}
    .cal-d.part{background:var(--c2);color:var(--t2)}
    .cal-d.on{color:#0c0a09;font-weight:700}
    .cal-d.sel{outline:2px solid var(--acc);outline-offset:-2px}
    .cal-d.today{box-shadow:inset 0 0 0 1px var(--t4)}
    .legend{margin-top:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
    .leg{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.64rem;color:var(--t3)}
    .leg i{width:9px;height:9px;border-radius:50%;display:block}

    /* META */
    .bar-lg{margin-top:12px;height:12px;background:var(--c2);border-radius:999px;overflow:hidden}
    .bar-lg .bar-fill{background:var(--red)}
    .goals{margin-top:16px;display:flex;flex-wrap:wrap;gap:16px}
    .goals label{font-family:var(--mono);font-size:.66rem;color:var(--t3)}
    .goals input{display:block;margin-top:6px;width:84px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;color:var(--t);font-family:var(--mono);font-size:.9rem;outline:none}
    .goals input:focus{border-color:var(--acc)}

    /* LOGROS */
    .badges{margin-top:14px;display:grid;grid-template-columns:1fr;gap:8px}
    @media(min-width:460px){.badges{grid-template-columns:1fr 1fr}}
    .bd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
    .bd.ok{border-color:var(--acc);background:var(--c2)}
    .bd-c{width:20px;height:20px;border-radius:50%;border:2px dashed var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .bd.ok .bd-c{border:none;background:var(--acc)}
    .bd-c svg{display:none}
    .bd.ok .bd-c svg{display:block}
    .bd-t{font-size:.82rem;color:var(--t4);line-height:1.2}
    .bd.ok .bd-t{color:var(--t)}

    .foot{text-align:center;font-family:var(--mono);font-size:.66rem;color:var(--t4);line-height:1.6;padding:4px 8px 0}
    .foot a{color:var(--t3)}

    /* TOAST */
    .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--c2);border:1px solid var(--line2);color:var(--t);padding:11px 18px;border-radius:999px;font-size:.82rem;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.5)}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .pts-float{position:fixed;font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--acc);pointer-events:none;z-index:9999;animation:float-up .8s ease-out forwards}
    @keyframes float-up{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-46px)}}
    @keyframes confetti-fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
    .skel{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.8rem;color:var(--t4)}
  </style>
</head>
<body>

<div class="wrap" id="app" hidden>

  <!-- MARCADOR -->
  <header class="card">
    <div class="hdr-top">
      <div>
        <p class="lbl">Planilla de entrenamiento</p>
        <p class="hdr-lv" id="lvName">Arrancando</p>
      </div>
      <div>
        <p class="hdr-pts" id="pts">0</p>
        <p class="lbl" style="text-align:right;margin-top:4px">puntos</p>
      </div>
    </div>
    <div class="bar"><div class="bar-fill" id="lvBar" style="width:0%"></div></div>
    <div class="hdr-foot">
      <span id="lvNext">&nbsp;</span>
      <span class="sync"><i class="sync-dot" id="syncDot"></i><span id="syncLabel">local</span></span>
    </div>
  </header>

  <!-- SEMANA -->
  <section class="card">
    <div class="row-top">
      <h2 class="h2">Esta semana</h2>
      <p class="mono" style="font-size:.85rem;color:var(--t2)"><span id="weekDone">0</span> / <span id="weekGoal">5</span></p>
    </div>
    <div class="week" id="week"></div>
    <div class="stats">
      <div class="st"><div class="st-n" id="stStreak">0</div><div class="st-l">semanas seguidas</div></div>
      <div class="st"><div class="st-n" id="stMonth">0</div><div class="st-l">este mes</div></div>
      <div class="st"><div class="st-n" id="stTotal">0</div><div class="st-l">total</div></div>
    </div>
  </section>

  <!-- CARGAR EL DÍA -->
  <section class="card">
    <div class="row-top">
      <h2 class="h2" id="dayTitle">Hoy</h2>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="mono" style="font-size:.85rem;color:var(--acc)" id="dayPts">+0 pts</span>
        <button class="link" id="backToday" onclick="goToday()" hidden>volver a hoy</button>
      </div>
    </div>
    <div class="acts" id="acts"></div>
  </section>

  <!-- MES -->
  <section class="card">
    <div class="cal-nav">
      <button class="cal-btn" onclick="moveMonth(-1)" aria-label="Mes anterior">←</button>
      <h2 class="h2" id="monthName">Agosto 2026</h2>
      <button class="cal-btn" onclick="moveMonth(1)" aria-label="Mes siguiente">→</button>
    </div>
    <div class="cal" id="cal"></div>
    <div class="legend" id="legend"></div>
  </section>

  <!-- META DEL AÑO -->
  <section class="card">
    <div class="row-top">
      <h2 class="h2">Meta <span id="yearLabel">2026</span></h2>
      <p class="mono" style="font-size:.85rem;color:var(--t2)"><span id="yearDone">0</span> / <span id="yearGoal">100</span></p>
    </div>
    <div class="bar-lg"><div class="bar-fill" id="yearBar" style="width:0%"></div></div>
    <p class="mono" style="margin-top:8px;font-size:.68rem;color:var(--t3)" id="yearPace">&nbsp;</p>
    <div class="goals">
      <label>Entrenos por semana
        <input type="number" min="1" max="7" id="goalWeek" inputmode="numeric">
      </label>
      <label>Meta total del año
        <input type="number" min="1" max="999" id="goalYear" inputmode="numeric">
      </label>
    </div>
  </section>

  <!-- LOGROS -->
  <section class="card">
    <h2 class="h2">Logros · <span class="mono" id="badgeCount" style="color:var(--t3)"></span></h2>
    <div class="badges" id="badges"></div>
  </section>

  <p class="foot">
    Un día con entreno cuenta como una sesión, aunque hagas dos cosas.<br>Los puntos sí se suman todos.
    <br><br><button class="link" onclick="clearDay()">borrar el día seleccionado</button>
  </p>
</div>

<div class="skel" id="skel">Cargando la planilla…</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
const STORE_KEY = 'ture2026_train';

const ACTIVITIES = [
  {id:'gym',   label:'Gimnasio',        short:'GYM',  pts:10, session:true,  color:'#dc2626'},
  {id:'run',   label:'Correr',          short:'RUN',  pts:10, session:true,  color:'#2563eb'},
  {id:'home',  label:'Entreno en casa', short:'CASA', pts:7,  session:true,  color:'#16a34a'},
  {id:'sport', label:'Fútbol o pádel',  short:'DEP',  pts:8,  session:true,  color:'#facc15'},
  {id:'golf',  label:'Golf caminando',  short:'GOLF', pts:6,  session:true,  color:'#10b981'},
  {id:'steps', label:'10.000 pasos',    short:'10K',  pts:4,  session:false, color:'#d4d4d8'},
  {id:'mob',   label:'Movilidad',       short:'MOV',  pts:3,  session:false, color:'#f97316'},
];
const ACT = Object.fromEntries(ACTIVITIES.map(a => [a.id, a]));

const LEVELS = [
  {min:0,    name:'Arrancando'},
  {min:120,  name:'Enganchado'},
  {min:320,  name:'Constante'},
  {min:650,  name:'Máquina'},
  {min:1100, name:'Fierrero'},
  {min:1700, name:'Bestia'},
  {min:2500, name:'Leyenda'},
];

const DAYS = ['L','M','X','J','V','S','D'];
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const CHECK = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0c0a09" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

// ═══════════════════════════════════════
// FECHAS
// ═══════════════════════════════════════
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = (d) => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const today = () => iso(new Date());

// ═══════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════
// log:  { '2026-08-16': ['gym','mob'] }   ids de actividades del día
// ts:   { '2026-08-16': 1755370000000 }   última edición, para resolver conflictos de sync
let log = {}, ts = {}, goals = {week:5, year:100};
let selected = today();
let cursor = { y: new Date().getFullYear(), m: new Date().getMonth() };

function loadLocal(){
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    log = raw.log || {};
    ts = raw.ts || {};
    goals = { week: raw.goals?.week ?? 5, year: raw.goals?.year ?? 100 };
  } catch(e) { /* primera vez, arrancamos de cero */ }
}
function saveLocal(){
  localStorage.setItem(STORE_KEY, JSON.stringify({ log, ts, goals }));
}

const idsOf = (key) => log[key] || [];
const isSessionDay = (key) => idsOf(key).some(id => ACT[id]?.session);
const dayPoints = (key) => idsOf(key).reduce((s,id) => s + (ACT[id]?.pts || 0), 0);

function toggle(key, id, ev){
  const cur = idsOf(key);
  const was = cur.includes(id);
  const weekBefore = weekSessions();

  log[key] = was ? cur.filter(x => x !== id) : [...cur, id];
  ts[key] = Date.now();
  saveLocal();
  syncUp(key);

  haptic();
  if (ev) spawnPts(ACT[id].pts, !was, ev);
  render();

  // Confetti solo en el toque exacto que completa la meta de la semana en curso
  if (weekBefore < goals.week && weekSessions() >= goals.week) {
    confetti(); showToast('Semana completa 🔥'); haptic('heavy');
  } else {
    showToast((was ? '−' : '+') + ACT[id].pts + ' pts' + (was ? '' : ' ✓'));
  }
}

function clearDay(){
  if (!idsOf(selected).length) { showToast('Ese día ya está vacío'); return; }
  if (!confirm(`Borrar lo cargado el ${selected}?`)) return;
  log[selected] = [];
  ts[selected] = Date.now();
  saveLocal(); syncUp(selected); render();
  showToast('Día borrado');
}

// ═══════════════════════════════════════
// CÁLCULOS
// ═══════════════════════════════════════
function stats(){
  let points = 0, sessions = 0, yearSessions = 0;
  const y = String(new Date().getFullYear());
  for (const key of Object.keys(log)) {
    points += dayPoints(key);
    if (isSessionDay(key)) { sessions++; if (key.startsWith(y)) yearSessions++; }
  }
  let idx = 0;
  LEVELS.forEach((l,i) => { if (points >= l.min) idx = i; });
  return { points, sessions, yearSessions, level: LEVELS[idx], next: LEVELS[idx+1] };
}
const weekDays = () => Array.from({length:7}, (_,i) => addDays(startOfWeek(new Date()), i));
const weekSessions = () => weekDays().filter(d => isSessionDay(iso(d))).length;

function streak(){
  const done = (ws) => Array.from({length:7}, (_,i) => addDays(ws,i)).filter(d => isSessionDay(iso(d))).length >= goals.week;
  let n = 0, ws = startOfWeek(new Date());
  if (done(ws)) n++;                       // la semana en curso solo suma si ya está cumplida
  ws = addDays(ws, -7);
  while (done(ws) && n < 200) { n++; ws = addDays(ws, -7); }
  return n;
}
function monthSessions(){
  return Object.keys(log).filter(k => {
    const d = parse(k);
    return d.getFullYear() === cursor.y && d.getMonth() === cursor.m && isSessionDay(k);
  }).length;
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function render(){
  const s = stats();
  const tk = today();

  // Marcador
  document.getElementById('pts').textContent = s.points;
  document.getElementById('lvName').textContent = s.level.name;
  const pctLv = s.next ? Math.min(100, Math.round((s.points - s.level.min) / (s.next.min - s.level.min) * 100)) : 100;
  document.getElementById('lvBar').style.width = pctLv + '%';
  document.getElementById('lvNext').textContent = s.next
    ? `Faltan ${s.next.min - s.points} pts para ${s.next.name}`
    : 'Nivel máximo. Sos leyenda.';

  // Semana
  const wDone = weekSessions();
  document.getElementById('weekDone').textContent = wDone;
  document.getElementById('weekGoal').textContent = goals.week;
  const week = document.getElementById('week');
  week.innerHTML = '';
  weekDays().forEach((d,i) => {
    const key = iso(d), ids = idsOf(key), on = isSessionDay(key);
    const b = document.createElement('button');
    b.className = 'wd' + (on ? ' on' : '') + (key === selected ? ' sel' : '') + (key === tk ? ' today' : '');
    const main = ids.find(x => ACT[x]?.session);
    b.innerHTML = `<span class="wd-l">${DAYS[i]}</span>
      <span class="wd-n" ${on ? `style="background:${ACT[main].color}"` : ''}>${d.getDate()}</span>
      <span class="wd-dots">${ids.filter(x => !ACT[x]?.session).map(x => `<i style="background:${ACT[x].color}"></i>`).join('')}</span>`;
    b.onclick = () => { selected = key; render(); };
    week.appendChild(b);
  });
  document.getElementById('stStreak').textContent = streak();
  document.getElementById('stMonth').textContent = monthSessions();
  document.getElementById('stTotal').textContent = s.sessions;

  // Día seleccionado
  const sd = parse(selected), selIds = idsOf(selected);
  document.getElementById('dayTitle').textContent = selected === tk
    ? 'Hoy'
    : `${DAYS[(sd.getDay()+6)%7]} ${sd.getDate()} de ${MONTHS[sd.getMonth()].toLowerCase()}`;
  document.getElementById('dayPts').textContent = `+${dayPoints(selected)} pts`;
  document.getElementById('backToday').hidden = selected === tk;
  const acts = document.getElementById('acts');
  acts.innerHTML = '';
  ACTIVITIES.forEach(a => {
    const on = selIds.includes(a.id);
    const b = document.createElement('button');
    b.className = 'act' + (on ? ' on' : '');
    b.innerHTML = `<span class="act-top">
        <span class="act-dot" ${on ? `style="background:${a.color}"` : ''}>${CHECK}</span>
        <span class="act-pts">+${a.pts}</span>
      </span>
      <span class="act-name">${a.label}</span>
      <span class="act-sub">${a.session ? 'cuenta como entreno' : 'suma puntos'}</span>`;
    b.onclick = (ev) => toggle(selected, a.id, ev);
    acts.appendChild(b);
  });

  // Mes
  document.getElementById('monthName').textContent = `${MONTHS[cursor.m]} ${cursor.y}`;
  const cal = document.getElementById('cal');
  cal.innerHTML = DAYS.map(d => `<span class="cal-h">${d}</span>`).join('');
  const pad = (new Date(cursor.y, cursor.m, 1).getDay() + 6) % 7;
  for (let i = 0; i < pad; i++) cal.appendChild(document.createElement('span'));
  const total = new Date(cursor.y, cursor.m + 1, 0).getDate();
  for (let n = 1; n <= total; n++) {
    const key = iso(new Date(cursor.y, cursor.m, n));
    const ids = idsOf(key), on = isSessionDay(key);
    const main = ids.find(x => ACT[x]?.session);
    const b = document.createElement('button');
    b.className = 'cal-d' + (on ? ' on' : ids.length ? ' part' : '') + (key === selected ? ' sel' : '') + (key === tk ? ' today' : '');
    if (on) b.style.background = ACT[main].color;
    b.textContent = n;
    b.onclick = () => { selected = key; render(); };
    cal.appendChild(b);
  }
  document.getElementById('legend').innerHTML = ACTIVITIES
    .map(a => `<span class="leg"><i style="background:${a.color}"></i>${a.short}</span>`).join('');

  // Meta del año
  const yr = new Date().getFullYear();
  document.getElementById('yearLabel').textContent = yr;
  document.getElementById('yearDone').textContent = s.yearSessions;
  document.getElementById('yearGoal').textContent = goals.year;
  document.getElementById('yearBar').style.width = Math.min(100, Math.round(s.yearSessions / Math.max(1, goals.year) * 100)) + '%';
  const dayOfYear = Math.floor((new Date() - new Date(yr,0,1)) / 86400000) + 1;
  const daysLeft = (new Date(yr,11,31) - new Date()) / 86400000;
  const falta = goals.year - s.yearSessions;
  document.getElementById('yearPace').textContent = falta <= 0
    ? 'Meta del año cumplida 🏆'
    : `Faltan ${falta} entrenos en ${Math.ceil(daysLeft)} días · ${(falta / Math.max(1, daysLeft/7)).toFixed(1)} por semana`;

  // Logros
  const st = streak();
  const badges = [
    {t:'Primera semana completa', ok: st >= 1 || wDone >= goals.week},
    {t:'10 entrenamientos',       ok: s.sessions >= 10},
    {t:'4 semanas seguidas',      ok: st >= 4},
    {t:'50 entrenamientos',       ok: s.sessions >= 50},
    {t:'1.000 puntos',            ok: s.points >= 1000},
    {t:'12 semanas seguidas',     ok: st >= 12},
    {t:'Meta del año',            ok: s.yearSessions >= goals.year},
  ];
  document.getElementById('badgeCount').textContent = `${badges.filter(b => b.ok).length}/${badges.length}`;
  document.getElementById('badges').innerHTML = badges.map(b =>
    `<div class="bd${b.ok ? ' ok' : ''}"><span class="bd-c">${CHECK}</span><span class="bd-t">${b.t}</span></div>`).join('');
}

function goToday(){ selected = today(); cursor = { y: new Date().getFullYear(), m: new Date().getMonth() }; render(); }
function moveMonth(n){
  const m = cursor.m + n;
  cursor = { y: cursor.y + Math.floor(m/12), m: ((m%12)+12)%12 };
  render();
}

let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}
function haptic(kind){ if (navigator.vibrate) navigator.vibrate(kind === 'heavy' ? [30,20,50] : 12); }
function spawnPts(pts, gained, ev){
  const el = document.createElement('div');
  el.className = 'pts-float';
  el.textContent = (gained ? '+' : '−') + pts;
  if (!gained) el.style.color = '#dc2626';
  el.style.left = (ev.clientX || innerWidth/2) + 'px';
  el.style.top = (ev.clientY || 200) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}
function confetti(){
  const colors = ACTIVITIES.map(a => a.color);
  for (let i = 0; i < 50; i++) {
    const el = document.createElement('div');
    const size = 5 + Math.random()*7;
    el.style.cssText = `position:fixed;width:${size}px;height:${size}px;background:${colors[i%colors.length]};border-radius:${Math.random()>.5?'50%':'2px'};left:${10+Math.random()*80}vw;top:-12px;z-index:9999;pointer-events:none;animation:confetti-fall ${1.2+Math.random()*.8}s ease-in ${Math.random()*.5}s forwards`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }
}

// ═══════════════════════════════════════
// SUPABASE SYNC
// ═══════════════════════════════════════
// La app anda 100% con localStorage. El sync es opcional: sirve para ver la
// misma planilla en el iPhone y en la compu.
//
// Para activarlo, creá un proyecto en Supabase, corré esto en el SQL editor:
//
//   create table ture2026_sync (
//     date_key text primary key,
//     payload jsonb,
//     updated_at timestamptz default now()
//   );
//   alter table ture2026_sync enable row level security;
//   create policy "acceso publico" on ture2026_sync for all using (true) with check (true);
//
// y pegá abajo la URL y la publishable key. Ojo: con esa policy cualquiera que
// vea el HTML puede leer y escribir la tabla. Para una planilla de entrenos da
// lo mismo, para algo sensible no.
//
// Conflictos entre dispositivos: gana la edición más nueva (ts).
const SB_URL = '';
const SB_KEY = '';
const PFX = 't-';   // prefijo del date_key
let sbClient = null;

function initSupabase(){
  if (!SB_URL || !SB_KEY) { setSync('local'); return; }
  try { if (typeof supabase !== 'undefined') sbClient = supabase.createClient(SB_URL, SB_KEY); }
  catch(e) { console.log('Supabase init error:', e); setSync('local'); }
}
function setSync(state){
  const dot = document.getElementById('syncDot'), lbl = document.getElementById('syncLabel');
  if (!dot) return;
  const map = { syncing:['#facc15','sync…'], synced:['#16a34a','synced'], offline:['#dc2626','sin conexión'], local:['#57534e','solo local'] };
  const [c,t] = map[state] || map.local;
  dot.style.background = c; lbl.textContent = t;
}
async function syncUp(key){
  if (!sbClient) return;
  try {
    setSync('syncing');
    const { error } = await sbClient.from('ture2026_sync').upsert(
      { date_key: PFX + key, payload: { train: idsOf(key), ts: ts[key] || 0 }, updated_at: new Date().toISOString() },
      { onConflict: 'date_key' });
    setSync(error ? 'offline' : 'synced');
  } catch(e) { setSync('offline'); }
}
async function syncGoals(){
  if (!sbClient) return;
  try {
    await sbClient.from('ture2026_sync').upsert(
      { date_key: PFX + 'goals', payload: { goals, ts: Date.now() }, updated_at: new Date().toISOString() },
      { onConflict: 'date_key' });
  } catch(e) { /* se reintenta en el próximo cambio */ }
}
async function syncDown(){
  if (!sbClient) return;
  try {
    setSync('syncing');
    const { data, error } = await sbClient.from('ture2026_sync').select('date_key, payload').like('date_key', PFX + '%');
    if (error || !data) { setSync('offline'); return; }
    let changed = false;
    data.forEach(row => {
      const key = row.date_key.slice(PFX.length), p = row.payload;
      if (!p) return;
      if (key === 'goals') {
        if (p.goals && !localStorage.getItem(STORE_KEY)) { goals = p.goals; changed = true; }
        return;
      }
      if (!Array.isArray(p.train)) return;
      if ((p.ts || 0) > (ts[key] || 0)) { log[key] = p.train; ts[key] = p.ts || 0; changed = true; }
    });
    if (changed) { saveLocal(); render(); showToast('Datos sincronizados ☁️'); }
    setSync('synced');
  } catch(e) { setSync('offline'); }
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
loadLocal();
document.getElementById('goalWeek').value = goals.week;
document.getElementById('goalYear').value = goals.year;
document.getElementById('goalWeek').addEventListener('change', e => {
  goals.week = Math.max(1, Math.min(7, Number(e.target.value) || 1));
  e.target.value = goals.week; saveLocal(); syncGoals(); render();
});
document.getElementById('goalYear').addEventListener('change', e => {
  goals.year = Math.max(1, Math.min(999, Number(e.target.value) || 1));
  e.target.value = goals.year; saveLocal(); syncGoals(); render();
});

document.getElementById('skel').remove();
document.getElementById('app').hidden = false;
initSupabase();
render();
syncDown();

setInterval(syncDown, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (selected !== today() && !idsOf(selected).length) goToday(); // cambió el día mientras estaba en background
  syncDown();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
